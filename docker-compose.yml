services:
  auth-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: auth
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"

  auth-service:
    build: ./auth-service
    volumes:
      - ./auth-service:/var/www
    ports:
      - "8001:8000"
    depends_on:
      - auth-db

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOSTS: auth-db,parking-db
    ports:
      - "8080:80"
    depends_on:
      - auth-db

  parking-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: parking
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"

  parking-service:
    build: ./parking-service
    volumes:
      - ./parking-service:/var/www
    ports:
      - "8002:8000"
    depends_on:
      - parking-db

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    depends_on:
      - auth-service
      - parking-service
